<!DOCTYPE html>
<html>
<head>
    <title>Test BoxHero Sync</title>
</head>
<body>
    <h1>Test BoxHero Sync API</h1>
    <button onclick="testSync()">Test Full Sync (Dry Run)</button>
    <div id="result"></div>

    <script>
        async function testSync() {
            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = 'Testing sync...';
            
            try {
                const response = await fetch('/api/admin/boxhero-sync', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        action: 'full-sync',
                        dryRun: true,
                        updateExisting: true,
                        addNew: true,
                        syncStock: true
                    })
                });
                
                const data = await response.json();
                resultDiv.innerHTML = `
                    <h3>Response (${response.status}):</h3>
                    <pre>${JSON.stringify(data, null, 2)}</pre>
                `;
            } catch (error) {
                resultDiv.innerHTML = `<h3>Error:</h3><pre>${error.message}</pre>`;
            }
        }
    </script>
</body>
</html>
